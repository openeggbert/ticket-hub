name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [sqlite, all-adapters]
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libargon2-dev libsqlite3-dev libpq-dev libcurl4-openssl-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  browser:
    name: Browser and accessibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libargon2-dev libsqlite3-dev libasio-dev
      - name: Install browser test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build isolated SQLite server
        run: |
          cmake -S . -B build/e2e -G Ninja \
            -DTICKETHUB_BUILD_SERVER=ON -DTICKETHUB_BUILD_CLI=OFF \
            -DTICKETHUB_WITH_SQLITE=ON -DTICKETHUB_WITH_POSTGRES=OFF \
            -DTICKETHUB_BUILD_TESTS=OFF
          cmake --build build/e2e --parallel
      - name: Run browser and accessibility checks
        run: npm run test:e2e
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
