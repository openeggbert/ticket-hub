# Official Docker Compose distribution path (D50): `docker compose up`
# alone brings up the full V1 instance (Postgres + the ticket-hub server),
# reachable at http://127.0.0.1:8080. `docker compose up -d postgres`
# continues to start only the database, for the "build from source, point
# it at a local Postgres" workflow documented in README.md's "Run with
# PostgreSQL" section -- postgres's host port stays published for that.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tickethub
      POSTGRES_USER: tickethub
      POSTGRES_PASSWORD: tickethub-dev
    ports:
      - "5432:5432"
    volumes:
      - ticket-hub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickethub -d tickethub"]
      interval: 5s
      timeout: 3s
      retries: 10

  ticket-hub:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TICKETHUB_DB_DRIVER: postgres
      TICKETHUB_DATABASE_URL: "host=postgres port=5432 dbname=tickethub user=tickethub password=tickethub-dev"
      TICKETHUB_AUTO_MIGRATE: "true"
      # A fresh instance ships with no accounts at all (D2: administrator-
      # created accounts only, no public registration) -- seeding is off by
      # default for a real deployment. Set to "true" to get the same demo
      # data/logins used throughout this README, or create the first admin
      # with `docker compose exec ticket-hub ticket-hub-cli create-user
      # "you@example.com" "Your Name" "a sufficiently long password" --admin`.
      TICKETHUB_SEED_DEMO: "false"
    ports:
      - "8080:8080"
    volumes:
      - ticket-hub-attachments:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  ticket-hub-postgres:
  ticket-hub-attachments:
